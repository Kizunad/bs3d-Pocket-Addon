plugins {
    id 'base'
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
}

ext {
    frameworkDir = file(findProperty('frameworkDir') ?: '../Kizuna-Inventory-UI-Framework')
    bs3dDir = file(findProperty('bs3dDir') ?: '../backpack-and-storage-3D')
    vanillaDir = file(findProperty('vanillaDir') ?: '../bs3d-Vanilla-Addon')
}

subprojects {
    apply plugin: 'fabric-loom'
    group = 'dev.kizuna.bs3d.pocket'
    version = '0.1.0-SNAPSHOT'
    base.archivesName = "bs3d-pocket-addon-${project.name}"
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wispforest.io/releases' }
        mavenCentral()
    }
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
    dependencies {
        minecraft 'com.mojang:minecraft:1.20.1'
        mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
        modImplementation 'net.fabricmc:fabric-loader:0.16.10'
        modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.3+1.20.1'
        implementation 'com.google.protobuf:protobuf-java:4.36.2'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    sourceSets.main.java.srcDir rootProject.file('shared/src/main/java')
    sourceSets.create('smoke') {
        java.srcDir rootProject.file('smoke/src/main/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test { useJUnitPlatform() }
    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') { expand version: project.version }
    }
    jar { from rootProject.file('LICENSE') }
    loom {
        mixin { defaultRefmapName = 'bs3d.pocket.refmap.json' }
        mods {
            'bs3d_pocket' { sourceSet sourceSets.main }
            'bs3d_pocket_smoke' { sourceSet sourceSets.smoke }
        }
    }
}
tasks.named('build') { dependsOn ':client:build', ':server:build' }
tasks.named('check') { dependsOn ':client:check', ':server:check' }
