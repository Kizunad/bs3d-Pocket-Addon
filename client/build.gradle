// 单机使用与专服相同的槽位限制和物品迁移实现。
sourceSets.main.java.srcDir rootProject.file('server/src/main/java')
dependencies {
    // 组合进来的 Loom 工程直接取 named 开发 JAR：按坐标走 mod 重映射的缓存不随上游改动刷新，也不会先构建上游。
    implementation('local.inventory-ui:client') { targetConfiguration = 'namedElements' }
    implementation('local.inventory-ui:server') { targetConfiguration = 'namedElements' }
    implementation('local.bs3d:client') { targetConfiguration = 'namedElements' }
    implementation('local.bs3d:server') { targetConfiguration = 'namedElements' }
    implementation('local.bs3d-vanilla:client') { targetConfiguration = 'namedElements' }
    modImplementation libs.owo
    implementation libs.tomlj
    implementation libs.antlr.runtime
}
processResources {
    from(rootProject.file('server/src/main/resources')) { exclude 'fabric.mod.json' }
}
loom.runs {
    smoke {
        client()
        source sourceSets.smoke
        runDir "../build/smoke/${rootProject.findProperty('smokeRun') ?: 'manual'}/client"
        property 'pocket.smoke.mode', rootProject.findProperty('smokeMode') ?: 'dedicated'
        property 'pocket.smoke.address', "127.0.0.1:${rootProject.findProperty('smokePort') ?: '25587'}"
        programArgs '--username', 'PocketSmoke', '--width', '1280', '--height', '720'
    }
}
