plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
}

subprojects {
    apply plugin: 'fabric-loom'
    group = 'dev.kizuna.bs3d.pocket'
    version = '0.1.0-SNAPSHOT'
    base.archivesName = "bs3d-pocket-addon-${project.name}"
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wispforest.io/releases' }
        mavenCentral()
    }
    java {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    dependencies {
        minecraft libs.minecraft
        mappings loom.officialMojangMappings()
        modImplementation libs.fabric.loader
        modImplementation libs.fabric.api
        implementation libs.protobuf.java
        testImplementation libs.junit.jupiter
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    sourceSets.main.java.srcDir rootProject.file('shared/src/main/java')
    sourceSets.create('smoke') {
        java.srcDir rootProject.file('smoke/src/main/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test { useJUnitPlatform() }
    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') { expand version: project.version }
    }
    jar { from rootProject.file('LICENSE') }
    loom {
        mixin { defaultRefmapName = 'bs3d.pocket.refmap.json' }
        mods {
            'bs3d_pocket' { sourceSet sourceSets.main }
            'bs3d_pocket_smoke' { sourceSet sourceSets.smoke }
        }
    }
}
tasks.named('build') { dependsOn ':client:build', ':server:build' }
tasks.named('check') { dependsOn ':client:check', ':server:check' }
